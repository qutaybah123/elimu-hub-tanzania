
services:
  postgres:
    image: postgres:15-alpine
    container_name: elimu_hub_db
    environment:
      POSTGRES_DB: elimu_hub
      POSTGRES_USER: elimu_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_me}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    networks:
      - elimu_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elimu_user -d elimu_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elimu_hub_redis
    networks:
      - elimu_network
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elimu_hub_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://elimu_user:${DB_PASSWORD:-secure_password_change_me}@postgres:5432/elimu_hub
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - elimu_network
    restart: unless-stopped
    volumes:
      - uploads_data:/app/uploads
      - ./backend/books:/app/books
      - ai_text_cache:/app/data/text_cache
      - ai_chats_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
        REACT_APP_WEBSITE_NAME: Elimu Hub Tanzania
    container_name: elimu_hub_frontend
    networks:
      - elimu_network
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: elimu_hub_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - elimu_network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

networks:
  elimu_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  ai_text_cache:
  ai_chats_data:
