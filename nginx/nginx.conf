events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    limit_req_zone $binary_remote_addr zone=api:10m  rate=300r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    upstream backend  { server backend:5000;  keepalive 32; }
    upstream frontend { server frontend:80;   keepalive 16; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;

        # Auth — strict rate limit
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection     "";
            proxy_set_header   Host           $host;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # AI message — long timeout (DeepSeek-R1 can think for 2+ min), no streaming needed
        location ~ ^/api/ai/chats/[^/]+/message$ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection     "";
            proxy_set_header   Host           $host;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # All other API routes
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection     "";
            proxy_set_header   Host           $host;
            proxy_set_header   X-Real-IP      $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api-docs { proxy_pass http://backend; }
        location /health   { proxy_pass http://backend; }
        location /uploads/ { proxy_pass http://backend; }

        # Frontend
        location / {
            proxy_pass       http://frontend;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
